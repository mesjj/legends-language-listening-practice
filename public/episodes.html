<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oído — Episodes</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --fog: #e6ebee; --paper: #f5f7f8; --ink: #1d2b34; --ink-soft: #5a6b75; --line: #cfd8dd;
    --now: #f2b705; --loop: #2f6fb0; --ok: #2e8b57;
    --serif: "Source Serif 4", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fog); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--loop); outline-offset: 2px; }
  .top { display: flex; align-items: baseline; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
  .top h1 { font: 600 22px/1 var(--serif); margin: 0; }
  .top span { color: var(--ink-soft); }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  h2 { font: 600 15px/1.3 var(--sans); color: var(--ink-soft); margin: 28px 0 8px; }
  h2:first-child { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; align-items: center; padding: 16px 20px; }
  li + li { border-top: 1px solid var(--line); }
  li.last { box-shadow: inset 3px 0 0 var(--now); }
  .t { font: 400 19px/1.3 var(--serif); color: var(--ink); text-decoration: none; }
  .t:hover { text-decoration: underline; text-decoration-color: var(--now); text-underline-offset: 4px; }
  .meta { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 120px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: var(--now); }
  .bar.game i { background: var(--ok); }
  .go { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
  .go a { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .go a:hover { border-color: var(--ink-soft); }
  .go a.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .empty { color: var(--ink-soft); }
  @media (max-width: 600px) {
    .top { padding: 10px 14px; }
    li { grid-template-columns: 1fr; padding: 14px 16px; }
    .go { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<header class="top"><h1>Oído</h1><span>Episodes</span></header>
<main id="list"><p class="empty">Loading…</p></main>
<script>
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem("oido:" + k)) ?? d; } catch { return d; } } };
const fmt = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h} h ${m} min` : `${m} min`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

(async () => {
  const eps = await (await fetch("api/episodes")).json();
  const main = document.getElementById("list");
  if (!eps.length) { main.innerHTML = `<p class="empty">No episodes yet. Add one with <code>scripts/add-episode.sh</code>.</p>`; return; }
  const last = store.get("lastEp", null);
  const shows = new Map();
  for (const e of eps.sort((a, b) => (a.show || "").localeCompare(b.show || "") || a.title.localeCompare(b.title, "es", { numeric: true }))) {
    const k = e.show || "Other";
    if (!shows.has(k)) shows.set(k, []);
    shows.get(k).push(e);
  }
  main.innerHTML = [...shows].map(([show, list]) => `
    <h2>${esc(show)}</h2>
    <ul>${list.map((e) => {
      const id = encodeURIComponent(e.id);
      const title = e.show ? e.title.replace(new RegExp(`\\s*[—–-]\\s*${e.show.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*$`), "").replace(new RegExp(`^${e.show}\\s*[—–-]\\s*`), "") : e.title;
      const pos = store.get("pos:" + e.id, 0);
      const pct = e.duration ? Math.min(100, (pos / e.duration) * 100) : 0;
      const game = Object.keys(store.get("game:" + e.id, { r: {} }).r || {}).length;
      return `<li class="${e.id === last ? "last" : ""}">
        <a class="t" href="./?ep=${id}">${esc(title)}</a>
        <div class="meta">
          <span>${fmt(e.duration)}</span>
          <span title="Where you left off"><span class="bar"><i style="width:${pct.toFixed(1)}%"></i></span>${pos > 5 ? "at " + fmt(pos) : "not started"}</span>
          ${game ? `<span title="Lines played in the dictation game"><span class="bar game"><i style="width:${Math.min(100, (game / e.lines) * 100).toFixed(1)}%"></i></span>${game} lines played</span>` : ""}
        </div>
        <div class="go"><a class="primary" href="./?ep=${id}">Listen</a><a href="play.html?ep=${id}">Dictation</a><a href="rpg.html?ep=${id}">Leyendas</a></div>
      </li>`;
    }).join("")}</ul>`).join("");
})();
</script>
</body>
</html>
